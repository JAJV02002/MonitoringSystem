[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Upload speed
upload_speed = 921600
monitor_speed = 115200

; Library dependencies
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    arduino-libraries/WiFi@^1.2.7

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

; Monitor filters
monitor_filters = 
    default
    time
    esp32_exception_decoder
